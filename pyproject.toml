[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inkletocard"
version = "0.4.0"
description = "Convert inkle belt patterns into card (tablet) weaving settings with a PDF report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0", "pillow>=10.0"]

[project.scripts]
inkletocard = "inkletocard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
